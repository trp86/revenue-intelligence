name: CI

# Manual only: this host has no runner, so a pull_request trigger would leave a
# queued check on every PR. Until a runner exists, `uv run revint-gate` is the
# evidence of green checks (docs/process.md). Restoring pull_request is tracked
# in issue #27. The commands below are the ones in src/revint/gate.py.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Ruff
        run: uv run ruff check .
      - name: Sqlfluff
        run: uv run sqlfluff lint sql
      - name: Pytest
        run: uv run pytest -m "not realdata"
