# Business decisions and paths. Changes go through a PR (docs/process.md rule 7).
# Unknown or missing required keys fail validation. Every key is documented here and in
# the Settings model (src/revint/config.py); a section left out takes its documented
# defaults. Only the paths below can be overridden from the environment
# (REVINT_PATHS_<KEY>), never business keys.
#
# Each new section needs a model in Settings and tests/unit/test_settings_<section>.py.

# Relative paths resolve against the project root, not the working directory.
paths:
  raw: data/raw                          # source Excel files, read-only
  bronze: data/bronze                    # bronze Parquet
  warehouse: data/warehouse.duckdb       # silver and gold
  app_db: data/app.duckdb                # app state (AI output, actions)
  reports: reports                       # generated reports, git-ignored (optional; this is the default)

# Bronze ingestion (spec 01 B2, B3, B7).
ingest:
  sheets:                                # sheet names to load
    - RAW SCJ SALES
  header_search_rows: 30                 # rows searched for the header row
  header_min_match: 0.8                  # share of expected_columns that must match (0 to 1]
  expected_columns:                      # 75 final names (spec 01 B3), from profiling (#31)
    - OrderReference
    - VoucherNo
    - CustomerCode
    - Customer
    - SalemanName
    - SALES_MAN_RBD
    - KAM
    - SalePlanDay
    - Date
    - SCJ_FISCAL_YEAR
    - SCJ_FISCAL_HALF_YEAR
    - QTR
    - Year
    - Month
    - SWE_ZIN_MONTH
    - SCJ_FISCAL_MONTH
    - PaymentType
    - Paid
    - Void
    - SAP_CODE
    - SCJ_CODE_1
    - Product_Decription
    - SCJ_CODE_2
    - UOM
    - FOB
    - TOTAL_FOB_IN_AMOUNT
    - Internal_Category
    - SCJ_VOLVAL_FILE
    - FRAGRANCES
    - Size
    - Actual_Brands_1
    - SCJ_SEGMENT
    - Actual_Brands_2
    - Sticker_(Individual/Shared)
    - Sticker_Size
    - Selling_Price
    - Selling_Amount
    - RBD_DISCOUNT_AMOUNT
    - Quantity(PCS)
    - Change_to_Ctn
    - PRICE
    - NET_AMOUNT_1
    - DISCOUNT_1
    - AMOUNT_AF_DIS
    - Discount_2
    - Net_Amount_2
    - Back_Margin_3%
    - Net_AMOUNT_3
    - CT_5%
    - TAX_AMOUNT
    - "price_LEVEL_ျပန္ေရြးရန္"
    - UnitPrice
    - Original_price
    - Diff_Price
    - Diff_Amount
    - Discount(%)_1
    - Discount(%)_2
    - DiscountAmount
    - Tax
    - SaleTeam
    - PaymentTerm
    - Channel_Type
    - RBD_CHANNEL_BREAKDOWN
    - Channel_Category
    - SCJ_CHAIN_2
    - SCJ_CHANNEL
    - Chain_Type
    - Chain_Name
    - DC
    - TOWNSHIP
    - CITY/TOWN
    - Branch_Name
    - SCJ_CITIES
    - Branch_Type
    - Region

# Void handling (spec 01 S6, decision D3: provisional, client to confirm).
void:
  blank_means: not_void                  # not_void -> void_flag = 0; or void
  value_map: {}                          # non-blank Void value -> 0 or 1; filled by profiling

# Exact duplicates (spec 01 S5, decision D4: provisional, client to confirm).
duplicates:
  exclude_from_net_sales: true           # gold omits the extra copies; silver marks them either way
  # key_columns: unset means ingest.expected_columns minus _source_row

# Label normalisation (spec 01 S3). A map turns a source label into its canonical name; a
# label with no entry is kept as it is and flagged f_unmapped_label. Matching is exact text
# after trimming both ends, case-sensitive. Only the obvious spelling variants are mapped
# (maintainer's decision on issue #37); every other label stays unmapped until a person adds it.
labels:
  channel_columns:                       # columns whose values are channel labels
    - Channel_Category
  branch_columns:                        # columns whose values are branch labels
    - Branch_Name
  channel_map:
    MODERN TRADE: Modern Trade
    MT: Modern Trade
  branch_map:
    MAGWAY: Magway
    Hpa-an: Hpa-An
    PyinooLwin: Pyinoolwin
    PYAY: Pyay
    DAWEI: Dawei

# Net sales (provisional, client to confirm; docs/decisions.md section 3). Defined once; gold
# uses it. Names are the final column names listed in ingest.expected_columns.
net_sales:
  field: Net_Amount_2                    # source column 46 (Excel AT): net of discounts, before the 3% back margin
  candidate_columns:                     # the amount columns net sales may be chosen from (spec 01 S11)
    - Selling_Amount
    - NET_AMOUNT_1
    - AMOUNT_AF_DIS
    - Net_Amount_2
    - Net_AMOUNT_3
    - TAX_AMOUNT
  quantity_field: Quantity(PCS)          # quantity column for free goods (spec 01 S7)
  exclude_flags: []                      # silver flag columns whose rows get included = false (spec 02 N3)

# Customer identity (spec 01 S4): the code is the key; near-duplicate codes are NOT merged.
# These are the source columns the customer-code table is built from (final column names).
customers:
  code_column: CustomerCode
  name_column: Customer
  branch_column: Branch_Name

# Data quality results (spec 01 section 5; maintainer's decision on issue #41). Severity and
# action are a fixed value per silver rule S1 to S12, not computed from a percentage, because
# where to draw a threshold is a business judgement. high = rests on an unconfirmed client
# assumption or changes which rows count.
quality:
  severity:
    S1: info
    S2: warning
    S3: warning
    S4: warning
    S5: high
    S6: high
    S7: warning
    S8: info
    S9: high
    S10: high
    S11: warning
    S12: info
  action:                                # flagged | excluded | transformed | recorded
    S1: transformed
    S2: flagged
    S3: transformed
    S4: recorded
    S5: excluded
    S6: flagged
    S7: flagged
    S8: flagged
    S9: excluded
    S10: excluded
    S11: flagged
    S12: recorded

# Reconciliation (spec 01 section 6).
recon:
  tolerance_amount: 0.01                 # allowed difference for amount checks
  product_column: SCJ_CODE_1             # R4 counts its distinct values as products (181 expected)
  date_column: Date                      # R4 reports its minimum and maximum (typed date column)
  docs_duplicate_count: 556              # exact duplicates the docs state (D4); the report shows the actual count next to it

# Gold layer (spec 02 section 8). Column names are final names (spec 01 B3).
marts:
  zero_fill: true                        # a month with no sales is a row with 0 (false: absent)

calendar:
  fiscal_year_start_month: 1             # 1 = fiscal year is the calendar year (open question)

regions:
  source_column: Region                  # default region of a branch
  branch_to_region: {}                   # normalised branch name -> region; overrides the column

# Peer groups for the peer category share mart. Thresholds for whitespace are spec 03's.
peer_groups:
  columns:                               # together define a peer group
    - Channel_Category
    - Branch_Name
  min_size: 10                           # a smaller group falls back to fallback_columns
  fallback_columns:                      # must be part of columns; empty = no fallback
    - Channel_Category

# Product dimension columns. Brand and category are provisional until story #73 profiles them.
product:
  code_column: SCJ_CODE_1
  name_column: Product_Decription
  brand_column: Actual_Brands_1
  category_column: Internal_Category

asof:
  date: 2020-02-29                       # as-of date of the data
