[project]
name = "revint"
version = "0.1.0"
description = "Revenue intelligence POC for sales managers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars",
    "duckdb",
    "fastapi",
    "pydantic",
    "typer",
    "google-genai",
    "pyyaml>=6.0.3",
    "fastexcel>=0.21.0",
    "uvicorn>=0.30",
]

[project.scripts]
revint = "revint.cli:app"
revint-gate = "revint.gate:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist>=3.8.0",
    "ruff",
    "sqlfluff",
    "xlsxwriter>=3.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n auto runs the tests on one worker per CPU core (pytest-xdist); each test builds in its own
# temporary folder, so workers share nothing. Use -n 0 to run in one process, for example to
# debug a failure with a debugger or to read the output in order.
addopts = "--strict-markers -n auto"
markers = [
    "realdata: needs the real client data under data/; skipped when data/ is absent and never run in CI",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
