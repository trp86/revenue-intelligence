[project]
name = "revint"
version = "0.1.0"
description = "Revenue intelligence POC for sales managers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars",
    "duckdb",
    "fastapi",
    "pydantic",
    "typer",
    "google-genai",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "sqlfluff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revint"]
