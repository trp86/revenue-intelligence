[project]
name = "revint"
version = "0.1.0"
description = "Revenue intelligence POC for sales managers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars",
    "duckdb",
    "fastapi",
    "pydantic",
    "typer",
    "google-genai",
    "pyyaml>=6.0.3",
]

[project.scripts]
revint = "revint.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "sqlfluff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "realdata: needs the real client data under data/; skipped when data/ is absent and never run in CI",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
